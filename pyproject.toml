[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "green-taxi-mlflow-project"
version = "0.1.0"
description = "Metaflow and MLflow pipeline for batch model monitoring, retraining, and champion promotion."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "metaflow>=2.12",
    "mlflow==3.8",
    "nannyml>=0.13",
    "numpy>=2.0",
    "pandas>=2.3",
    "pyarrow>=16",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
